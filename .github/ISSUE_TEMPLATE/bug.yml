name: Bug report
description: Report incorrect or unsafe Wayfinder behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private projects, personal data, or transcripts. Use private vulnerability reporting for security issues.
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Conversational intake
        - State or lifecycle
        - Dashboard
        - OpenAI skill or plugin
        - Claude Code skill or plugin
        - Packaging or validation
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use a public or synthetic project only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: This report does not contain a vulnerability requiring private disclosure.
          required: true
