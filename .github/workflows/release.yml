name: Prepare release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONHASHSEED: "0"
      TZ: "UTC"
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Match tag to package version
        run: |
          PACKAGE_VERSION="$(python3 -c 'import json; print(json.load(open(".codex-plugin/plugin.json", encoding="utf-8"))["version"])')"
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"

      - name: Validate tagged release
        run: |
          python3 scripts/validate_repo.py
          python3 -m unittest discover -s tests -v
          python3 scripts/scan_secrets.py --all

      - name: Build and verify release artifacts
        run: |
          python3 scripts/package_wayfinder.py build --output-dir dist
          python3 scripts/package_wayfinder.py verify dist/*.zip
          (cd dist && shasum -a 256 *.zip > SHA256SUMS.txt)

      - name: Create draft release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt \
            --draft \
            --verify-tag \
            --title "Wayfinder $GITHUB_REF_NAME" \
            --generate-notes
