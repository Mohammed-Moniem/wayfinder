name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      TZ: "UTC"
      LC_ALL: "C.UTF-8"
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Compile Python and check dashboard JavaScript
        run: |
          python3 -m compileall -q scripts tests skills/wayfinder/scripts
          node --check skills/wayfinder/assets/dashboard/app.js

      - name: Validate repository contracts
        run: python3 scripts/validate_repo.py

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Scan worktree, index, and history for secrets
        run: python3 scripts/scan_secrets.py --all

      - name: Prove deterministic packages
        run: |
          python3 scripts/package_wayfinder.py build --output-dir build/first
          python3 scripts/package_wayfinder.py build --output-dir build/second
          python3 scripts/package_wayfinder.py verify build/first/*.zip
          for archive in build/first/*.zip; do
            cmp "$archive" "build/second/$(basename "$archive")"
          done
